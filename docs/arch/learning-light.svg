<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 314" width="802" height="314" role="img" aria-label="Self-learning: decide, log, outcome, recalibrate, retrain, gate, then promote the next version or keep the current one"><title>Self-learning: decide, log, outcome, recalibrate, retrain, gate, then promote the next version or keep the current one</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.muted { fill: #59636e; }
.title { font-weight: 600; }
.sweep { animation: sweep 6s ease-in-out infinite both; }
@keyframes sweep { 0% { opacity: .22; } 7% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: .22; } }
.glow { animation: glow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes glow { 0%, 55% { stroke-width: 1; } 62% { stroke-width: 4; } 72%, 100% { stroke-width: 1; } }
.flow { stroke-dasharray: 5 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes wave { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
.grow { animation: grow 6s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: left; }
@keyframes grow { 0%, 10% { transform: scaleX(0); } 35%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.pop { animation: pop 6s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#59636e"/></marker></defs><rect width="802" height="314" rx="14" fill="#ffffff"/><text x="401" y="24" text-anchor="middle" font-size="13" class="title">D1A learns from what actually happened</text><g class="glow" style="animation-delay:0.0s"><rect x="14" y="40" width="236" height="64" rx="14" fill="#ffffff" stroke="#7c3aed"/></g><rect x="14" y="40" width="236" height="64" rx="14" fill="#7c3aed" fill-opacity=".1"/><circle cx="32" cy="58" r="10" fill="#7c3aed"/><text x="32" y="62" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">1</text><text x="50" y="63" font-size="12" class="title">Decide</text><text x="28" y="84" font-size="10" class="muted">answers with a calibrated P</text><text x="28" y="97" font-size="10" class="muted">e.g. P(patch fixes the issue) = 0.83</text><g class="glow" style="animation-delay:1.0s"><rect x="283" y="40" width="236" height="64" rx="14" fill="#ffffff" stroke="#0284c7"/></g><rect x="283" y="40" width="236" height="64" rx="14" fill="#0284c7" fill-opacity=".1"/><circle cx="301" cy="58" r="10" fill="#0284c7"/><text x="301" y="62" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">2</text><text x="319" y="63" font-size="12" class="title">Log</text><text x="297" y="84" font-size="10" class="muted">FeedbackLog: the request, the answer</text><text x="297" y="97" font-size="10" class="muted">and the model that gave it (repo@tag)</text><g class="glow" style="animation-delay:2.0s"><rect x="552" y="40" width="236" height="64" rx="14" fill="#ffffff" stroke="#d97706"/></g><rect x="552" y="40" width="236" height="64" rx="14" fill="#d97706" fill-opacity=".1"/><circle cx="570" cy="58" r="10" fill="#d97706"/><text x="570" y="62" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">3</text><text x="588" y="63" font-size="12" class="title">Outcome</text><text x="566" y="84" font-size="10" class="muted">the world reports back later:</text><text x="566" y="97" font-size="10" class="muted">tests pass/fail, a label is corrected</text><g class="glow" style="animation-delay:3.0s"><rect x="552" y="176" width="236" height="64" rx="14" fill="#ffffff" stroke="#f59e0b"/></g><rect x="552" y="176" width="236" height="64" rx="14" fill="#f59e0b" fill-opacity=".1"/><circle cx="570" cy="194" r="10" fill="#f59e0b"/><text x="570" y="198" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">4</text><text x="588" y="199" font-size="12" class="title">Recalibrate</text><text x="566" y="220" font-size="10" class="muted">OutcomeCalibrator refits P on outcomes</text><text x="566" y="233" font-size="10" class="muted">minutes; fixes base-rate drift</text><g class="glow" style="animation-delay:4.0s"><rect x="283" y="176" width="236" height="64" rx="14" fill="#ffffff" stroke="#059669"/></g><rect x="283" y="176" width="236" height="64" rx="14" fill="#059669" fill-opacity=".1"/><circle cx="301" cy="194" r="10" fill="#059669"/><text x="301" y="198" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">5</text><text x="319" y="199" font-size="12" class="title">Retrain</text><text x="297" y="220" font-size="10" class="muted">a small LoRA update on the</text><text x="297" y="233" font-size="10" class="muted">resolved decisions (d1a.train --data)</text><g class="glow" style="animation-delay:5.0s"><rect x="14" y="176" width="236" height="64" rx="14" fill="#ffffff" stroke="#e11d48"/></g><rect x="14" y="176" width="236" height="64" rx="14" fill="#e11d48" fill-opacity=".1"/><circle cx="32" cy="194" r="10" fill="#e11d48"/><text x="32" y="198" text-anchor="middle" font-size="10" class="title" style="fill:#ffffff">6</text><text x="50" y="199" font-size="12" class="title">Gate</text><text x="28" y="220" font-size="10" class="muted">promote only if held-out log loss drops</text><text x="28" y="233" font-size="10" class="muted">(95% CI &lt; 0) and no frozen suite regresses</text><path d="M 250 72 L 279 72" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><path d="M 519 72 L 548 72" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><path d="M 670.0 104 L 670.0 172" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><path d="M 552 208 L 523 208" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><path d="M 283 208 L 254 208" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><path d="M 132.0 176 L 132.0 108" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><text x="144.0" y="138.0" font-size="9" class="mono muted">promote: the next version (d1a.versions)</text><text x="144.0" y="152.0" font-size="9" class="muted">or keep the current model</text><line x1="14" y1="262" x2="788" y2="262" stroke="#d0d7de"/><text x="401" y="282" text-anchor="middle" font-size="10" class="muted">Measured on D1A-E4B as a coding-agent verifier, on repositories it never saw:</text><text x="401" y="298" text-anchor="middle" font-size="10" class="mono">recalibrating on outcomes: calibration error 0.63 → 0.04 · training on outcomes: AUROC 0.74 → 0.81</text></svg>