"/><text x="378.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;opt&gt;</text></g><g class="sweep" style="animation-delay:1.08s"><rect x="404" y="40" width="30" height="26" rx="6" fill="#ffffff" stroke="#d97706" /><rect x="404" y="40" width="30" height="26" rx="6" fill="#d97706" fill-opacity="0.16"/><text x="419.0" y="57" text-anchor="middle" font-size="11" class="mono">A</text></g><g class="sweep" style="animation-delay:1.26s"><rect x="438" y="40" width="48" height="26" rx="6" fill="#ffffff" stroke="#d97706" /><rect x="438" y="40" width="48" height="26" rx="6" fill="#d97706" fill-opacity="0.16"/><text x="462.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;/opt&gt;</text></g><g class="sweep" style="animation-delay:1.44s"><rect x="490" y="40" width="44" height="26" rx="6" fill="#ffffff" stroke="#d97706" /><rect x="490" y="40" width="44" height="26" rx="6" fill="#d97706" fill-opacity="0.16"/><text x="512.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;opt&gt;</text></g><g class="sweep" style="animation-delay:1.62s"><rect x="538" y="40" width="30" height="26" rx="6" fill="#ffffff" stroke="#d97706" /><rect x="538" y="40" width="30" height="26" rx="6" fill="#d97706" fill-opacity="0.16"/><text x="553.0" y="57" text-anchor="middle" font-size="11" class="mono">B</text></g><g class="sweep" style="animation-delay:1.80s"><rect x="572" y="40" width="48" height="26" rx="6" fill="#ffffff" stroke="#d97706" /><rect x="572" y="40" width="48" height="26" rx="6" fill="#d97706" fill-opacity="0.16"/><text x="596.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;/opt&gt;</text></g><g class="sweep" style="animation-delay:1.98s"><rect x="624" y="40" width="64" height="26" rx="6" fill="#ffffff" stroke="#e11d48" class="glow"/><rect x="624" y="40" width="64" height="26" rx="6" fill="#e11d48" fill-opacity="0.16"/><text x="656.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;decide&gt;</text></g><g class="sweep" style="animation-delay:2.16s"><rect x="692" y="40" width="34" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" /><rect x="692" y="40" width="34" height="26" rx="6" fill="#7c3aed" fill-opacity="0.16"/><text x="709.0" y="57" text-anchor="middle" font-size="11" class="mono">&lt;q&gt;</text></g><g class="sweep" style="animation-delay:2.34s"><rect x="730" y="40" width="26" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" /><rect x="730" y="40" width="26" height="26" rx="6" fill="#ffffff" fill-opacity="1"/><text x="743.0" y="57" text-anchor="middle" font-size="11" class="mono">…</text></g><text x="12" y="28" font-size="11" class="muted">document (read once)</text><text x="238" y="28" font-size="11" class="muted">question 1</text><text x="692" y="28" font-size="11" class="muted">question 2</text><text x="12" y="92" font-size="11" class="muted">position ids</text><text x="12" y="112" font-size="11" class="mono">0 1 2 … n−1</text><text x="238" y="112" font-size="11" class="mono">n n+1 n+2 …</text><text x="692" y="112" font-size="11" class="mono">n …</text><path d="M 686 106 C 662 132, 258 132, 242 118" fill="none" stroke="#7c3aed" class="flow"/><text x="465.0" y="138" text-anchor="middle" font-size="10" class="muted">positions restart for every question, so each sees exactly what it would see alone</text></svg>