<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 200" width="802" height="200" role="img" aria-label="Where D1A runs: one server and one model for text, photos and voice"><title>Where D1A runs: one server and one model for text, photos and voice</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.muted { fill: #59636e; }
.title { font-weight: 600; }
.sweep { animation: sweep 6s ease-in-out infinite both; }
@keyframes sweep { 0% { opacity: .22; } 7% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: .22; } }
.glow { animation: glow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes glow { 0%, 55% { stroke-width: 1; } 62% { stroke-width: 4; } 72%, 100% { stroke-width: 1; } }
.flow { stroke-dasharray: 5 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes wave { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
.grow { animation: grow 6s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: left; }
@keyframes grow { 0%, 10% { transform: scaleX(0); } 35%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.pop { animation: pop 6s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#59636e"/></marker></defs><rect width="802" height="200" rx="14" fill="#ffffff"/><rect x="8" y="20" width="170" height="62" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="8" y="20" width="170" height="62" rx="14" fill="#64748b" fill-opacity=".1"/><text x="93.0" y="46" text-anchor="middle" font-size="12" class="title">Your code / agents</text><text x="93.0" y="64" text-anchor="middle" font-size="10" class="muted">TypeSafe SDK · curl · MCP</text><path d="M 178 51 L 308 51" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><text x="243.0" y="45" text-anchor="middle" font-size="9" class="mono muted">/v1/systemone</text><rect x="310" y="20" width="190" height="62" rx="14" fill="#ffffff" stroke="#7c3aed"/><rect x="310" y="20" width="190" height="62" rx="14" fill="#7c3aed" fill-opacity=".1"/><text x="405.0" y="46" text-anchor="middle" font-size="12" class="title">d1a.serve</text><text x="405.0" y="64" text-anchor="middle" font-size="10" class="muted">System One API · prefix cache</text><path d="M 500 51 L 538 51" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><text x="519.0" y="45" text-anchor="middle" font-size="9" class="mono muted"></text><rect x="540" y="20" width="254" height="62" rx="14" fill="#ffffff" stroke="#059669"/><rect x="540" y="20" width="254" height="62" rx="14" fill="#059669" fill-opacity=".1"/><text x="667.0" y="46" text-anchor="middle" font-size="12" class="title">MLX (Apple Silicon) · PyTorch</text><text x="667.0" y="64" text-anchor="middle" font-size="10" class="muted">8-bit on a Mac · bf16 on CUDA / MPS</text><rect x="8" y="120" width="170" height="62" rx="14" fill="#ffffff" stroke="#f59e0b"/><rect x="8" y="120" width="170" height="62" rx="14" fill="#f59e0b" fill-opacity=".1"/><text x="93.0" y="146" text-anchor="middle" font-size="12" class="title">Photo · voice note</text><text x="93.0" y="164" text-anchor="middle" font-size="10" class="muted">JPEG / PNG · WAV, ≤ 30 s</text><path d="M 178 151 L 308 151" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><text x="243.0" y="145" text-anchor="middle" font-size="9" class="mono muted">/v1/systemone/media</text><rect x="310" y="120" width="190" height="62" rx="14" fill="#ffffff" stroke="#e11d48"/><rect x="310" y="120" width="190" height="62" rx="14" fill="#e11d48" fill-opacity=".1"/><text x="405.0" y="146" text-anchor="middle" font-size="12" class="title">d1a.serve · encoders</text><text x="405.0" y="164" text-anchor="middle" font-size="10" class="muted">vision &amp; audio → soft tokens</text><path d="M 500 151 C 600 151, 667 140, 667 86" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)" class="flow"/><text x="676" y="128" font-size="9" class="mono muted">same model</text><text x="676" y="142" font-size="9" class="muted">--idle-unload frees</text><text x="676" y="156" font-size="9" class="muted">both when idle</text></svg>