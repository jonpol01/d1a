name: release

# Push a vX.Y.Z tag to release. The tag, pyproject.toml and CHANGELOG.md must agree, and every fragment in changes/ must
# already be assembled into that version's section (scripts/release_notes.py --release-check);
# the unit tests run again on the tagged commit; the GitHub release text is that version's CHANGELOG.md section,
# written by hand, and the wheel and sdist are attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: python3 scripts/release_notes.py --release-check "$GITHUB_REF_NAME"
      - run: uv sync --extra serve --extra media
      # the Hugging Face files the unit tests read (pinned tokenizers), kept on GitHub's cache between runs: faster, and a
      # slow or unreachable Hub does not fail CI
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: huggingface-${{ runner.os }}-
      # the same unit tests as CI: every test file except tests/conftest.py's OUTSIDE_UNIT_TESTS
      - run: uv run python -m pytest tests --unit -q
      - run: uv build
      - run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "D1A ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
