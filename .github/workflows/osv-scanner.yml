# Weekly scan of uv.lock against the OSV vulnerability database, results in the Security tab. Detection only: it changes
# no pins and fails nothing. Adapted from NousResearch/hermes-agent (MIT).
name: OSV-Scanner
on:
  schedule:
    - cron: "0 0 * * 1"   # Monday 09:00 JST
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  scan:
    name: Scan uv.lock
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=uv.lock
      results-file-name: osv-results.sarif
      fail-on-vuln: false
