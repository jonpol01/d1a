# The unit suite on the newest versions pyproject.toml allows, not on uv.lock's: a fresh `pip install d1a` resolves those,
# and a new transformers once broke video and Gemma 4 loading (#322, #324) while CI, on the lock, stayed green. Report
# only: it changes no pins and gates no pull request. Its summary lists every version that differs from the lock.
name: newest-deps

on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest:
    name: tests on the newest allowed versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: resolve the newest allowed versions
        run: |
          cp uv.lock "$RUNNER_TEMP/uv.lock.pinned"
          uv lock --upgrade
          python3 - "$RUNNER_TEMP/uv.lock.pinned" uv.lock >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, tomllib
          old, new = ({p["name"]: p["version"] for p in tomllib.load(open(f, "rb"))["package"] if "version" in p} for f in sys.argv[1:3])
          moved = sorted((n, old.get(n, "(new)"), v) for n, v in new.items() if old.get(n) != v and n != "d1a")
          print(f"### {len(moved)} packages newer than uv.lock\n\n| package | uv.lock | newest allowed |\n|---|---|---|")
          print("\n".join(f"| {n} | {a} | {b} |" for n, a, b in moved))
          PY
      - run: uv sync --extra serve --extra media --extra mcp
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: huggingface-${{ runner.os }}-
      - run: uv run python -m pytest tests --unit -q
