# Modified from Kev (https://github.com/jaredpalmer/kev), Copyright 2026 Jared Palmer, Apache-2.0.
# Changes for D1A Copyright 2026 John Soliva: package renamed kev -> d1a, D1A metadata and URLs, the thin client split out.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d1a"
version = "0.4.0"
description = "D1A: a small decision model on Gemma 4 with a TypeSafe-compatible /v1/systemone API, built on Kev"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jared Palmer" }, { name = "John Soliva" }]
maintainers = [{ name = "John Soliva" }]
requires-python = ">=3.12,<3.14"
keywords = ["decision-model", "calibration", "lora", "typesafe", "transformers", "gemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=3.0",
    "numpy>=2.5.3",
    "peft>=0.21",
    "pydantic>=2.9",
    "pyyaml>=6",   # d1a.training.recipe
    "scikit-learn>=1.9.1",
    "torch>=2.6,<2.14",
    "transformers>=5.17,<6",
]

[project.urls]
Repository = "https://github.com/jonpol01/d1a"
Issues = "https://github.com/jonpol01/d1a/issues"
Upstream = "https://github.com/jaredpalmer/kev"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.30",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",   # the Apple Silicon backend (d1a.backends.mlx); a no-op elsewhere
]
mlx = [
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
media = [
    "pillow>=10",
    "soundfile>=0.12",
    "torchvision",   # Gemma 4's image processor
    "av>=14",        # video clips: frames sampled by Gemma 4's video processor (PyAV wheels bundle ffmpeg)
]
mcp = [
    "mcp>=2.2,<3",   # d1a.agents.mcp_server: the agent-factory presets as MCP tools
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.9",
    "modal==1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: the HTTP API tests (tests/test_api.py); they serve the tiny checkpoint in process, or check D1A_BASE_URL when it is set"]

[tool.setuptools]
packages = ["d1a", "d1a.agents", "d1a.backends", "d1a.core", "d1a.eval", "d1a.learning", "d1a.serving", "d1a.training"]
