[project]
name = "d1a-client"
version = "0.0.1"
description = "Dependency-free client for D1A, a small decision model on Gemma 4 (System One API)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "John Soliva" }]
urls = { Homepage = "https://github.com/jonpol01/d1a" }

[tool.hatch.build.targets.wheel]
packages = ["d1a_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
